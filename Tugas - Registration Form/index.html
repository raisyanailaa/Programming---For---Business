<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Buat Akun Baru</h1>
            <p class="subtitle">Daftar untuk memulai perjalanan Anda</p>
            
            <form id="registrationForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Nama Depan *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Nama Belakang *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Nomor Telepon *</label>
                    <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="birthdate">Tanggal Lahir *</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Jenis Kelamin *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Pilih</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Alamat Lengkap *</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Kota *</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="postalCode">Kode Pos *</label>
                        <input type="text" id="postalCode" name="postalCode" maxlength="5" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" minlength="4" required>
                    <small>Minimal 4 karakter</small>
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required>
                    <small id="passwordHint">Minimal 6 karakter</small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Saya setuju dengan syarat dan ketentuan *</label>
                </div>
                
                <button type="submit" class="btn-submit">Daftar Sekarang</button>
                
                <p class="login-link">Sudah punya akun? <a href="#">Masuk</a></p>
            </form>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
